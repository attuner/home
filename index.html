<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OmniHub — Modern Personal Workspace</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090d16" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: text;
    }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

  <!-- Header Section -->
  <header class="sticky top-0 z-40 bg-[#090d16]/80 backdrop-blur-xl border-b border-slate-800/80 px-4 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      
      <div class="flex items-center gap-2">
        <div class="p-2 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl shadow-lg shadow-indigo-600/30">
          <i data-lucide="command" class="w-5 h-5 text-white"></i>
        </div>
        <span class="font-extrabold text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400 hidden sm:inline">
          OmniHub
        </span>
      </div>

      <!-- Universal Search -->
      <div class="flex-1 max-w-2xl relative">
        <i data-lucide="search" class="absolute left-3.5 top-3 w-4 h-4 text-slate-400"></i>
        <input 
          id="globalSearch" 
          type="search" 
          placeholder="Filter modules, actions, notes, events, news..." 
          class="w-full bg-slate-900/90 border border-slate-700/80 pl-10 pr-10 py-2.5 rounded-xl text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition placeholder:text-slate-500"
          oninput="handleSearch(this.value)"
        />
        <button id="clearSearchBtn" onclick="clearSearch()" class="absolute right-3 top-2.5 hidden text-slate-400 hover:text-white">
          <i data-lucide="x-circle" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Quick Actions -->
      <div class="flex items-center gap-2">
        <button onclick="syncAllCloudData()" title="Sync with Cloud" class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 hover:bg-slate-800 transition">
          <i id="syncIcon" data-lucide="refresh-cw" class="w-4 h-4 text-slate-300"></i>
        </button>
        <button onclick="toggleDrawer()" class="relative p-2.5 rounded-xl bg-slate-900 border border-slate-800 hover:bg-slate-800 transition">
          <i data-lucide="bell" class="w-4 h-4 text-slate-300"></i>
          <span id="notifBadge" class="absolute top-1.5 right-1.5 w-2 h-2 bg-indigo-500 rounded-full ring-2 ring-[#090d16] hidden"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Side Push Mobile-Style Notification Panel -->
  <div id="drawerOverlay" onclick="toggleDrawer()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>
  <aside id="drawer" class="fixed right-0 top-0 bottom-0 w-full sm:w-[420px] bg-slate-900/95 backdrop-blur-2xl border-l border-slate-800 z-50 translate-x-full transition-transform duration-300 ease-out p-6 flex flex-col shadow-2xl">
    <div class="flex items-center justify-between pb-4 border-b border-slate-800">
      <div class="flex items-center gap-2.5">
        <div class="p-1.5 bg-indigo-500/10 rounded-lg">
          <i data-lucide="bell-ring" class="w-4 h-4 text-indigo-400"></i>
        </div>
        <h2 class="font-bold text-base text-slate-100">Pending Actions & Alerts</h2>
      </div>
      <button onclick="toggleDrawer()" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <div id="notifFeed" class="flex-1 overflow-y-auto custom-scroll divide-y divide-slate-800/60 py-2">
      <!-- Injected by renderNotifications() -->
    </div>
  </aside>

  <!-- Bento Grid Container -->
  <main class="max-w-7xl mx-auto p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 flex-1">

    <!-- Card 1: Tasks / Todos -->
    <section class="searchable glass-panel rounded-2xl p-5 flex flex-col h-[400px]">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="check-circle" class="w-4 h-4 text-indigo-400"></i>
          <h3 class="font-semibold text-sm">Action Items</h3>
        </div>
        <span id="todoMeta" class="text-xs text-slate-400">0 left</span>
      </div>
      <form onsubmit="createTodo(event)" class="flex gap-2 mb-3">
        <input id="todoInput" type="text" placeholder="Add assignment or task..." required class="flex-1 bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" />
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 font-bold px-3.5 rounded-xl text-xs transition">+</button>
      </form>
      <div id="todoList" class="flex-1 overflow-y-auto custom-scroll space-y-2 pr-1"></div>
    </section>

    <!-- Card 2: Interactive Dynamic Calendar -->
    <section class="searchable glass-panel rounded-2xl p-5 flex flex-col h-[400px]">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="calendar" class="w-4 h-4 text-emerald-400"></i>
          <h3 class="font-semibold text-sm">Schedule & Calendar</h3>
        </div>
        <span id="calMonthLabel" class="text-xs font-semibold text-slate-400"></span>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center text-xs mb-3 select-none">
        <span class="text-slate-500 font-bold">Su</span><span class="text-slate-500 font-bold">Mo</span><span class="text-slate-500 font-bold">Tu</span><span class="text-slate-500 font-bold">We</span><span class="text-slate-500 font-bold">Th</span><span class="text-slate-500 font-bold">Fr</span><span class="text-slate-500 font-bold">Sa</span>
      </div>
      <form onsubmit="createEvent(event)" class="space-y-2 border-t border-slate-800 pt-2">
        <input id="eventTitle" type="text" placeholder="Title..." required class="w-full bg-slate-950/60 border border-slate-800 rounded-lg px-2.5 py-1 text-xs outline-none focus:border-emerald-500" />
        <div class="flex gap-1.5">
          <input id="eventTime" type="datetime-local" required class="flex-1 bg-slate-950/60 border border-slate-800 rounded-lg px-2 py-1 text-xs outline-none" />
          <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 px-3 rounded-lg text-xs font-semibold transition">Save</button>
        </div>
      </form>
      <div id="calendarEvents" class="flex-1 overflow-y-auto custom-scroll mt-2 space-y-1.5"></div>
    </section>

    <!-- Card 3: Notes & Voice Recorder -->
    <section class="searchable glass-panel rounded-2xl p-5 flex flex-col h-[400px]">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="edit-3" class="w-4 h-4 text-amber-400"></i>
          <h3 class="font-semibold text-sm">Scratchpad & Notes</h3>
        </div>
        <button id="voiceBtn" onclick="toggleVoiceRecording()" title="Dictate voice note" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
          <i data-lucide="mic" class="w-3.5 h-3.5"></i>
        </button>
      </div>
      <form onsubmit="createNote(event)" class="space-y-2 mb-2">
        <input id="noteTitle" type="text" placeholder="Title..." required class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-1.5 text-xs outline-none focus:border-amber-500" />
        <div class="flex gap-2">
          <textarea id="noteContent" rows="1" placeholder="Write or record note..." required class="flex-1 bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-1.5 text-xs outline-none focus:border-amber-500 custom-scroll resize-none"></textarea>
          <button type="submit" class="bg-amber-600 hover:bg-amber-500 font-semibold px-3 rounded-xl text-xs transition">Post</button>
        </div>
      </form>
      <div id="notesContainer" class="flex-1 overflow-y-auto custom-scroll space-y-2"></div>
    </section>

    <!-- Card 4: Curated Live News (Telangana, Andhra Pradesh, India) -->
    <section class="searchable glass-panel rounded-2xl p-5 flex flex-col h-[400px]">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="globe" class="w-4 h-4 text-sky-400"></i>
          <h3 class="font-semibold text-sm">Regional Intelligence</h3>
        </div>
        <select id="newsRegionSelector" onchange="fetchRegionalNews(this.value)" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs outline-none">
          <option value="Telangana">Telangana</option>
          <option value="Andhra Pradesh">Andhra Pradesh</option>
          <option value="National India">India</option>
        </select>
      </div>
      <div id="newsList" class="flex-1 overflow-y-auto custom-scroll space-y-2 pr-1"></div>
    </section>

    <!-- Card 5: Cloud Files & Google Drive -->
    <section class="searchable glass-panel rounded-2xl p-5 flex flex-col h-[400px]">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="cloud-upload" class="w-4 h-4 text-rose-400"></i>
          <h3 class="font-semibold text-sm">Drive Vault</h3>
        </div>
        <span id="uploadIndicator" class="text-[10px] text-slate-400"></span>
      </div>
      <div class="border border-dashed border-slate-800 rounded-xl p-3 text-center mb-2 hover:border-slate-700 transition">
        <input type="file" id="fileUploader" class="hidden" onchange="handleFileUpload(this)" />
        <label for="fileUploader" class="cursor-pointer text-xs text-rose-400 hover:text-rose-300 block font-medium">
          Choose file for Google Drive upload
        </label>
      </div>
      <div id="filesList" class="flex-1 overflow-y-auto custom-scroll space-y-1.5"></div>
    </section>

    <!-- Card 6: Contacts Directory -->
    <section class="searchable glass-panel rounded-2xl p-5 flex flex-col h-[400px]">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="users" class="w-4 h-4 text-violet-400"></i>
          <h3 class="font-semibold text-sm">Contacts</h3>
        </div>
      </div>
      <form onsubmit="createContact(event)" class="space-y-1.5 mb-2">
        <input id="contactName" type="text" placeholder="Full name..." required class="w-full bg-slate-950/60 border border-slate-800 rounded-lg px-2.5 py-1 text-xs outline-none focus:border-violet-500" />
        <div class="flex gap-2">
          <input id="contactPhone" type="tel" placeholder="Phone..." required class="flex-1 bg-slate-950/60 border border-slate-800 rounded-lg px-2.5 py-1 text-xs outline-none" />
          <button type="submit" class="bg-violet-600 hover:bg-violet-500 px-3 rounded-lg text-xs font-semibold">Save</button>
        </div>
      </form>
      <div id="contactsContainer" class="flex-1 overflow-y-auto custom-scroll space-y-1.5"></div>
    </section>

    <!-- Card 7: Instant Dictionary & Lexicon -->
    <section class="searchable glass-panel rounded-2xl p-5 flex flex-col h-[400px]">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="book" class="w-4 h-4 text-teal-400"></i>
          <h3 class="font-semibold text-sm">Lexicon Lookup</h3>
        </div>
      </div>
      <div class="flex gap-2 mb-2">
        <input id="dictionaryQuery" type="text" placeholder="Lookup definition..." class="flex-1 bg-slate-950/60 border border-slate-800 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-teal-500" />
        <button onclick="searchWord()" class="bg-teal-600 hover:bg-teal-500 px-3 rounded-lg text-xs font-semibold">Define</button>
      </div>
      <div id="dictionaryResult" class="flex-1 overflow-y-auto custom-scroll bg-slate-950/50 rounded-xl p-3 text-xs leading-relaxed">
        <span class="text-slate-500">Definitions will appear here...</span>
      </div>
    </section>

    <!-- Card 8: Quick Launch Vault -->
    <section class="searchable glass-panel rounded-2xl p-5 flex flex-col h-[400px]">
      <div class="flex items-center gap-2 mb-3">
        <i data-lucide="external-link" class="w-4 h-4 text-amber-300"></i>
        <h3 class="font-semibold text-sm">Ecosystem Bridges</h3>
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs flex-1">
        <a href="https://mail.google.com" target="_blank" class="p-3 bg-slate-950/60 hover:bg-slate-800 border border-slate-800/80 rounded-xl flex items-center gap-2 transition">
          <i data-lucide="mail" class="w-4 h-4 text-red-400"></i> Gmail
        </a>
        <a href="https://drive.google.com" target="_blank" class="p-3 bg-slate-950/60 hover:bg-slate-800 border border-slate-800/80 rounded-xl flex items-center gap-2 transition">
          <i data-lucide="hard-drive" class="w-4 h-4 text-blue-400"></i> Drive
        </a>
        <a href="https://calendar.google.com" target="_blank" class="p-3 bg-slate-950/60 hover:bg-slate-800 border border-slate-800/80 rounded-xl flex items-center gap-2 transition">
          <i data-lucide="calendar" class="w-4 h-4 text-emerald-400"></i> Calendar
        </a>
        <a href="https://web.whatsapp.com" target="_blank" class="p-3 bg-slate-950/60 hover:bg-slate-800 border border-slate-800/80 rounded-xl flex items-center gap-2 transition">
          <i data-lucide="message-circle" class="w-4 h-4 text-green-400"></i> WhatsApp
        </a>
        <a href="https://github.com" target="_blank" class="p-3 bg-slate-950/60 hover:bg-slate-800 border border-slate-800/80 rounded-xl flex items-center gap-2 transition">
          <i data-lucide="github" class="w-4 h-4 text-slate-200"></i> GitHub
        </a>
        <a href="https://keep.google.com" target="_blank" class="p-3 bg-slate-950/60 hover:bg-slate-800 border border-slate-800/80 rounded-xl flex items-center gap-2 transition">
          <i data-lucide="bookmark" class="w-4 h-4 text-yellow-400"></i> Keep
        </a>
      </div>
    </section>

  </main>

  <script>
    /* =========================================================================
       1. SETUP & CONFIGURATION
       Paste your Apps Script Web App Deployment URL below.
       ========================================================================= */
    const APPS_SCRIPT_ENDPOINT = "https://script.google.com/macros/s/AKfycbyES1mOuUjOvQxeqREPdKHL-dpgFIq9xaSjE0fh5go_Fny8h4xIesnBSx1hf7BVeUc1xg/exec";

    // Application state with LocalStorage fallback
    let STORE = JSON.parse(localStorage.getItem("OMNIHUB_STORE")) || {
      todos: [],
      notes: [],
      contacts: [],
      reminders: [],
      files: []
    };

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      buildCalendar();
      fetchRegionalNews("Telangana");
      renderAllComponents();
      syncAllCloudData();
      registerPWAComponents();
    });

    function saveLocally() {
      localStorage.setItem("OMNIHUB_STORE", JSON.stringify(STORE));
    }

    /* =========================================================================
       2. CORS-SAFE DATA SYNC ENGINE
       ========================================================================= */
    async function syncAllCloudData() {
      if (!APPS_SCRIPT_ENDPOINT || APPS_SCRIPT_ENDPOINT.includes("YOUR_APPS_SCRIPT")) return;
      
      const syncIcon = document.getElementById("syncIcon");
      syncIcon.classList.add("animate-spin");
      
      try {
        const response = await fetch(APPS_SCRIPT_ENDPOINT);
        const result = await response.json();
        if (result.status === "success" && result.data) {
          STORE = Object.assign(STORE, result.data);
          saveLocally();
          renderAllComponents();
        }
      } catch (err) {
        console.warn("Operating in offline-first mode:", err);
      } finally {
        syncIcon.classList.remove("animate-spin");
      }
    }

    // CORS Safe Transport using text/plain body without preflight trigger
    async function sendToCloud(payload) {
      if (!APPS_SCRIPT_ENDPOINT || APPS_SCRIPT_ENDPOINT.includes("YOUR_APPS_SCRIPT")) return;
      try {
        await fetch(APPS_SCRIPT_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error("Cloud push failed:", e);
      }
    }

    /* =========================================================================
       3. GLOBAL REAL-TIME SEARCH
       ========================================================================= */
    function handleSearch(val) {
      const q = val.toLowerCase().trim();
      const clearBtn = document.getElementById("clearSearchBtn");
      clearBtn.classList.toggle("hidden", q.length === 0);

      const cards = document.querySelectorAll(".searchable");
      cards.forEach(card => {
        const hasMatch = card.innerText.toLowerCase().includes(q);
        card.style.display = (q === "" || hasMatch) ? "flex" : "none";
      });
    }

    function clearSearch() {
      const input = document.getElementById("globalSearch");
      input.value = "";
      handleSearch("");
    }

    /* =========================================================================
       4. NOTIFICATION & DRAWER SYSTEM
       ========================================================================= */
    function toggleDrawer() {
      const drawer = document.getElementById("drawer");
      const overlay = document.getElementById("drawerOverlay");
      const isOpen = drawer.classList.contains("translate-x-0");

      if (isOpen) {
        drawer.classList.remove("translate-x-0");
        drawer.classList.add("translate-x-full");
        overlay.classList.add("opacity-0", "pointer-events-none");
      } else {
        drawer.classList.remove("translate-x-full");
        drawer.classList.add("translate-x-0");
        overlay.classList.remove("opacity-0", "pointer-events-none");
        document.getElementById("notifBadge").classList.add("hidden");
      }
    }

    function renderNotifications() {
      const feed = document.getElementById("notifFeed");
      const badge = document.getElementById("notifBadge");
      const items = [];

      (STORE.todos || []).filter(t => t.status !== "completed").forEach(t => {
        items.push({ type: "Task", title: t.task, date: "Immediate" });
      });

      (STORE.reminders || []).forEach(r => {
        items.push({ type: "Event", title: r.title, date: r.datetime });
      });

      if (items.length > 0) badge.classList.remove("hidden");

      feed.innerHTML = items.length === 0 
        ? `<div class="text-center py-10 text-slate-500 text-xs">Zero alerts pending</div>`
        : items.map(item => `
          <div class="py-3">
            <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${item.type}</span>
            <div class="text-xs font-medium text-slate-200 mt-1">${item.title}</div>
            <div class="text-[10px] text-slate-400">${item.date}</div>
          </div>
        `).join("");
    }

    /* =========================================================================
       5. MODULE HANDLERS (Todos, Notes, Calendar, Contacts, Drive)
       ========================================================================= */
    function renderAllComponents() {
      // Tasks
      const todoList = document.getElementById("todoList");
      todoList.innerHTML = (STORE.todos || []).map(t => `
        <div class="flex items-center justify-between p-2 rounded-xl bg-slate-950/70 border border-slate-800/80 text-xs">
          <span class="${t.status === 'completed' ? 'line-through text-slate-500' : 'text-slate-200'}">${t.task}</span>
          <button onclick="removeRecord('Todos', '${t.id}')" class="text-slate-400 hover:text-rose-400">
            <i data-lucide="check" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      `).join("");
      document.getElementById("todoMeta").innerText = `${(STORE.todos || []).length} items`;

      // Notes
      const notesContainer = document.getElementById("notesContainer");
      notesContainer.innerHTML = (STORE.notes || []).map(n => `
        <div class="p-2.5 rounded-xl bg-slate-950/70 border border-slate-800/80 text-xs">
          <div class="font-bold text-amber-300">${n.title}</div>
          <div class="text-slate-300 mt-0.5 whitespace-pre-wrap">${n.content}</div>
        </div>
      `).join("");

      // Contacts
      const contactsContainer = document.getElementById("contactsContainer");
      contactsContainer.innerHTML = (STORE.contacts || []).map(c => `
        <div class="flex justify-between items-center p-2 rounded-xl bg-slate-950/70 border border-slate-800/80 text-xs">
          <div>
            <div class="font-medium text-slate-200">${c.name}</div>
            <a href="tel:${c.phone}" class="text-[10px] text-indigo-400 hover:underline">${c.phone}</a>
          </div>
          <button onclick="removeRecord('Contacts', '${c.id}')" class="text-slate-500 hover:text-rose-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
        </div>
      `).join("");

      // Files
      const filesList = document.getElementById("filesList");
      filesList.innerHTML = (STORE.files || []).map(f => `
        <div class="flex justify-between items-center p-2 rounded-xl bg-slate-950/70 border border-slate-800/80 text-xs">
          <span class="truncate max-w-[170px] text-slate-300">${f.name}</span>
          <a href="${f.url}" target="_blank" class="text-emerald-400 hover:underline text-[10px] font-semibold">Open</a>
        </div>
      `).join("");

      // Reminders
      const calEvents = document.getElementById("calendarEvents");
      calEvents.innerHTML = (STORE.reminders || []).map(r => `
        <div class="flex justify-between items-center p-1.5 rounded-lg bg-slate-950/50 border border-slate-800/50 text-[11px]">
          <span class="text-slate-200">${r.title}</span>
          <span class="text-slate-400 text-[10px]">${r.datetime.replace("T", " ")}</span>
        </div>
      `).join("");

      renderNotifications();
      lucide.createIcons();
    }

    function createTodo(e) {
      e.preventDefault();
      const input = document.getElementById("todoInput");
      const record = { id: Date.now().toString(), task: input.value, status: "pending", created_at: new Date().toISOString() };
      STORE.todos.unshift(record);
      saveLocally();
      renderAllComponents();
      sendToCloud({ action: "addItem", sheet: "Todos", data: record });
      input.value = "";
    }

    function createNote(e) {
      e.preventDefault();
      const title = document.getElementById("noteTitle");
      const content = document.getElementById("noteContent");
      const record = { id: Date.now().toString(), title: title.value, content: content.value, created_at: new Date().toISOString() };
      STORE.notes.unshift(record);
      saveLocally();
      renderAllComponents();
      sendToCloud({ action: "addItem", sheet: "Notes", data: record });
      title.value = "";
      content.value = "";
    }

    function createEvent(e) {
      e.preventDefault();
      const title = document.getElementById("eventTitle");
      const time = document.getElementById("eventTime");
      const record = { id: Date.now().toString(), title: title.value, datetime: time.value, status: "scheduled" };
      STORE.reminders.unshift(record);
      saveLocally();
      renderAllComponents();
      sendToCloud({ action: "addItem", sheet: "Reminders", data: record });
      title.value = "";
      time.value = "";
    }

    function createContact(e) {
      e.preventDefault();
      const name = document.getElementById("contactName");
      const phone = document.getElementById("contactPhone");
      const record = { id: Date.now().toString(), name: name.value, phone: phone.value };
      STORE.contacts.unshift(record);
      saveLocally();
      renderAllComponents();
      sendToCloud({ action: "addItem", sheet: "Contacts", data: record });
      name.value = "";
      phone.value = "";
    }

    function removeRecord(sheet, id) {
      STORE[sheet.toLowerCase()] = STORE[sheet.toLowerCase()].filter(item => item.id !== id);
      saveLocally();
      renderAllComponents();
      sendToCloud({ action: "deleteItem", sheet: sheet, id: id });
    }

    // Google Drive Base64 Upload
    function handleFileUpload(elem) {
      const file = elem.files[0];
      if (!file) return;
      const indicator = document.getElementById("uploadIndicator");
      indicator.innerText = "Encoding & Uploading...";

      const reader = new FileReader();
      reader.onload = async function() {
        const base64Data = reader.result.split(",")[1];
        await sendToCloud({
          action: "uploadFile",
          fileName: file.name,
          mimeType: file.type,
          base64Data: base64Data
        });
        indicator.innerText = "Uploaded to Drive!";
        setTimeout(() => { indicator.innerText = ""; syncAllCloudData(); }, 3000);
      };
      reader.readAsDataURL(file);
    }

    /* =========================================================================
       6. INTERACTIVE CALENDAR ENGINE
       ========================================================================= */
    function buildCalendar() {
      const now = new Date();
      const grid = document.getElementById("calendarGrid");
      const monthLabel = document.getElementById("calMonthLabel");
      monthLabel.innerText = now.toLocaleString("default", { month: "short", year: "numeric" });

      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const startDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();

      for (let i = 0; i < startDay; i++) {
        grid.innerHTML += `<div></div>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const isToday = d === now.getDate();
        grid.innerHTML += `
          <div class="py-1 rounded-md ${isToday ? 'bg-indigo-600 font-bold text-white shadow' : 'hover:bg-slate-800 text-slate-300'}">
            ${d}
          </div>
        `;
      }
    }

    /* =========================================================================
       7. DICTIONARY & VOICE RECOGNITION
       ========================================================================= */
    async function searchWord() {
      const query = document.getElementById("dictionaryQuery").value.trim();
      const container = document.getElementById("dictionaryResult");
      if (!query) return;

      container.innerHTML = `<span class="text-slate-400">Searching...</span>`;
      try {
        const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${query}`);
        const data = await res.json();
        const first = data[0].meanings[0].definitions[0];
        container.innerHTML = `
          <div class="font-bold text-slate-100 text-sm">${data[0].word}</div>
          <div class="text-teal-400 italic my-1">${first.definition}</div>
          ${first.example ? `<div class="text-slate-400">"${first.example}"</div>` : ""}
        `;
      } catch {
        container.innerHTML = `<span class="text-rose-400">Term not found.</span>`;
      }
    }

    function toggleVoiceRecording() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech Recognition is not supported by your browser.");
        return;
      }
      const recognition = new SpeechRecognition();
      const voiceBtn = document.getElementById("voiceBtn");
      
      voiceBtn.classList.add("bg-rose-600", "text-white");
      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById("noteContent").value += " " + transcript;
        voiceBtn.classList.remove("bg-rose-600", "text-white");
      };

      recognition.onerror = () => voiceBtn.classList.remove("bg-rose-600", "text-white");
      recognition.onend = () => voiceBtn.classList.remove("bg-rose-600", "text-white");
    }

    /* =========================================================================
       8. REGIONAL NEWS ENGINE (Telangana, Andhra Pradesh, India)
       ========================================================================= */
    async function fetchRegionalNews(region) {
      const list = document.getElementById("newsList");
      list.innerHTML = `<div class="text-xs text-slate-500 py-4 text-center">Loading regional stream...</div>`;
      
      const endpoint = `https://news.google.com/rss/search?q=${encodeURIComponent(region)}&hl=en-IN&gl=IN&ceid=IN:en`;
      try {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(endpoint)}`);
        const json = await res.json();
        
        list.innerHTML = (json.items || []).slice(0, 6).map(item => `
          <a href="${item.link}" target="_blank" class="block p-2 rounded-xl bg-slate-950/70 border border-slate-800/80 hover:border-slate-700 transition">
            <div class="text-xs font-medium text-slate-200 line-clamp-1">${item.title}</div>
            <div class="text-[10px] text-slate-500 mt-1">${new Date(item.pubDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
          </a>
        `).join("");
      } catch {
        list.innerHTML = `<div class="text-xs text-rose-400 py-2">Failed to retrieve news feeds.</div>`;
      }
    }

    /* =========================================================================
       9. PWA EMBEDDED ENGINE (Manifest & Service Worker Auto-Registration)
       ========================================================================= */
    function registerPWAComponents() {
      // Generate Web Manifest dynamically
      const manifest = {
        name: "OmniHub Workspace",
        short_name: "OmniHub",
        start_url: "./",
        display: "standalone",
        background_color: "#090d16",
        theme_color: "#090d16",
        icons: [
          {
            src: "https://cdn-icons-png.flaticon.com/512/906/906343.png",
            sizes: "512x512",
            type: "image/png"
          }
        ]
      };
      const stringManifest = JSON.stringify(manifest);
      const blobManifest = new Blob([stringManifest], { type: 'application/json' });
      const manifestURL = URL.createObjectURL(blobManifest);
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = manifestURL;
      document.head.appendChild(manifestLink);

      // Register Inline Service Worker for Offline Execution
      if ('serviceWorker' in navigator) {
        const swScript = `
          const CACHE_NAME = 'omnihub-v2';
          self.addEventListener('install', e => {
            e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./'])));
          });
          self.addEventListener('fetch', e => {
            e.respondWith(
              caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match('./')))
            );
          });
        `;
        const blobSW = new Blob([swScript], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blobSW)).catch(() => {});
      }
    }
  </script>
